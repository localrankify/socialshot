<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SocialShot</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<link rel="preload" href="/brand/ApfelGrotezk-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Apfel Grotezk";src:url("/brand/ApfelGrotezk-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* heading font: Mazzard H, on every h1, h2 and h3. Body text stays Apfel Grotezk. */
@font-face{font-family:"Mazzard H";src:url("/brand/MazzardH-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Mazzard H";src:url("/brand/MazzardH-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Mazzard H";src:url("/brand/MazzardH-SemiBold.otf") format("opentype");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Mazzard H";src:url("/brand/MazzardH-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
:root{--font-head:"Mazzard H","Apfel Grotezk","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:var(--font-head)}
:root{
  --brand:#8B5CF6;--brand-press:#7C4DEB;--brand-ink:#0F0F14;--brand-soft:#F3EEFF;--brand-line:#DDD2FE;--brand-deep:#6D3FD9;
  --frame:#F4F2FB;--frame-2:#FFFFFF;--frame-line:rgba(0,0,0,.06);--frame-text:#0F0F14;--frame-dim:#5F5C72;
  --bg:#FFFFFF;--muted:#F6F4FD;--line:#ECE9F6;--line-2:#E1DDF0;
  --text:#0F0F14;--dim:#5F5C72;--faint:#9D99B2;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --good:#0F8A57;--good-soft:#E6F6EE;--bad:#D3343F;--bad-soft:#FDECEE;--live:#E5323F;
  --r-lg:16px;--r:12px;--r-sm:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--text);font:14px/1.5 "Apfel Grotezk","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none;fill:currentColor}
::selection{background:var(--brand-line)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#DDDDE0;border-radius:999px;border:3px solid #fff}

/* ---------- frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100vh}
.side{background:var(--frame);color:var(--frame-text);display:flex;flex-direction:column;height:100vh;padding:14px 10px 12px;min-width:0}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 22px 6px}
.side-head .logo{height:36px;width:auto;display:block}
.side-head .mark{display:none;width:34px;height:34px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);border:0;background:transparent;color:var(--dim);cursor:pointer;flex:none}
.side .icon-btn{color:var(--frame-dim)}
.icon-btn:active{background:var(--muted)}.side .icon-btn:active{background:var(--frame-2)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav h4{font-size:12px;font-weight:500;color:var(--frame-dim);padding:14px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 10px;border-radius:7px;border:0;background:transparent;color:var(--frame-text);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nav-item svg{width:17px;height:17px}
.nav-item svg{color:var(--frame-dim)}
.nav-item:active{background:var(--frame-2)}
.nav-item.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.nav-item.on svg{color:var(--brand-ink)}
.label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--frame-text);white-space:nowrap}
.nav-item.on .count{background:rgba(42,26,18,.14);color:var(--brand-ink)}
.avatar{width:26px;height:26px;border-radius:50%;background:rgba(139,92,246,.18);color:#B79CFB;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;overflow:hidden}
img.avatar{object-fit:cover;background:rgba(255,255,255,.08)}
.tav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--muted)}
#title{display:flex;align-items:center;gap:10px}
.chprev{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);animation:rise .25s ease both}
.chprev img,.chprev .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#EFECF8}
.chprev b{display:block;font-size:14px;color:var(--brand-ink)}
.chprev span{font-size:12px;color:var(--faint)}
.chprev.bad{background:#FDECEC;color:#A12A2A;font-size:13px}
.chprev .sk{width:120px}
.nav-item.on .avatar{background:var(--brand-ink);color:var(--brand)}
.nav-item.on img.avatar{background:var(--brand-ink)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.3s infinite;flex:none}
.side-foot{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--frame-line)}
.side-card{background:var(--frame-2);border-radius:var(--r);padding:12px 14px;margin-top:8px;font-size:12px;color:var(--frame-dim);display:flex;flex-direction:column;gap:7px}
.side-card div{display:flex;align-items:center;gap:9px}
.led{width:7px;height:7px;border-radius:50%;background:#3DDC97;flex:none}.led.no{background:#FF6B78}.led.mid{background:var(--brand)}
.plans-btn{margin-top:10px;width:100%;background:var(--frame-text);color:var(--brand-ink);border:0}
.scrim{display:none}

main{background:var(--bg);margin:8px 8px 8px 0;border-radius:var(--r-lg);height:calc(100vh - 16px);overflow-y:auto;min-width:0;scrollbar-gutter:stable}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 28px;min-height:54px;border-bottom:1px solid transparent;transition:border-color .2s ease}
.topbar.stuck{border-color:var(--line)}
#vbanner:empty{display:none}
.upd{display:grid;gap:14px}
.upd ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--text);max-height:180px;overflow:auto}
.upd ul small{color:var(--dim)}
.upd .cmd{display:flex;gap:8px;align-items:center}
.upd .cmd code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:var(--muted);border-radius:8px;padding:9px 11px}
.upd h3{font-size:13px;font-weight:600;color:var(--brand-ink);margin:0}
.vb{display:flex;align-items:center;gap:12px;margin:12px 28px 0;padding:12px 12px 12px 16px;border-radius:12px;background:#FFF4E6;color:#7A3E0C;font-size:14px;animation:rise .3s ease both}
.vb svg{width:18px;height:18px;flex:none;color:var(--brand-deep)}
.vb span{flex:1;min-width:0}
.vb b{color:#5A2C06}
@media (max-width:640px){.vb{margin:10px 16px 0;flex-wrap:wrap}}
.topbar .titles{flex:1;min-width:0}
#tpic:empty{display:none}
#tpic img,#tpic .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;font-size:15px}
#tpic span.avatar{background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700}
#tpic.live img,#tpic.live .avatar{padding:2px;background:#fff;border:2px solid #E5323F}
.topbar.tabbed{border-color:var(--line)}
.topbar.tabbed .titles{flex:0 1 auto;max-width:34%}
.topbar.tabbed #actions{margin-left:auto}
.utabs:empty{display:none}
.utabs{display:flex;gap:2px;padding:3px;background:var(--muted);border-radius:11px;overflow-x:auto;scrollbar-width:none}
@media (min-width:761px){.topbar.tabbed{position:sticky}.topbar.tabbed .utabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.topbar.tabbed .titles{max-width:calc(50% - 230px)}}
@media (max-width:760px){.utabs{order:5;flex-basis:100%;margin:2px 0 0;position:relative}.topbar.tabbed .titles{max-width:none;flex:1}}
.utabs .tabbtn{height:34px;padding:0 14px;border-radius:8px;background:transparent;color:var(--dim);font-size:13px;transition:background-color .18s ease,color .18s ease}
.utabs .tabbtn:hover{background:#EEEBF8;color:var(--text)}
.utabs .tabbtn::after{display:none}
.utabs .tabbtn.on{background:transparent;color:var(--brand-ink)}
.utabs .tabbtn{position:relative;z-index:1}
.utabs .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--brand);z-index:0;transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}
.utabs .tabbtn,.utabs .tabbtn svg,.utabs .tabbtn .n{transition:color .25s ease,background-color .25s ease}
.utabs .tabbtn.on svg{color:var(--brand-ink)}
.utabs .tabbtn .n{background:var(--muted);color:var(--dim)}
.utabs .tabbtn.on .n{background:rgba(42,26,18,.14);color:var(--brand-ink)}
.rdot{flex:none;width:9px;height:9px;border-radius:50%;background:#fff}
.btn .rdot.on{background:#E5323F;animation:pulse 1.3s infinite}
/* live stream panel */
.stream{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:14px;background:#161618;border-radius:16px;padding:12px;margin-bottom:22px;color:#ECE9F6;animation:rise .3s ease both}
.stream .player{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.stream iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.noembed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:#0E0E10;color:#ECE9F6}
.noembed .logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:4px}
.noembed .logo svg{width:22px;height:22px}
.noembed b{font-size:15px;color:#fff}
.noembed span{font-size:13px;color:#9D99B2;max-width:380px}
.noembed .btn{margin-top:6px}
.sinfo{display:flex;flex-direction:column;gap:12px;padding:6px 6px 4px 2px;min-width:0}
.sinfo .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sinfo .logo{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.sinfo .logo svg{width:16px;height:16px}
.sinfo .lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#E5323F;color:#fff;padding:3px 10px;border-radius:999px}
.sinfo .lv i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.sinfo h3{font-size:16px;line-height:1.4;font-weight:600;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sinfo .by{font-size:12px;color:#9D99B2;margin-top:-6px}
.sstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.sstats div{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px}
.sstats b{display:block;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.01em}
.sstats span{font-size:11px;color:#9D99B2}
.sinfo .cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sinfo .cta .btn{height:46px;width:100%;justify-content:center;font-size:15px}
.sinfo .cta small{font-size:12px;color:#9D99B2;text-align:center}
.splat{display:flex;gap:4px;margin-left:auto}
.splat button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.06);color:#9D99B2;cursor:pointer;transition:background-color .15s ease}
.splat button:hover{background:rgba(255,255,255,.12)}
.splat button.on{background:rgba(139,92,246,.22)}
.splat svg{width:15px;height:15px}
@media (max-width:960px){.stream{grid-template-columns:1fr}}
.sbadge{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;background:var(--muted);color:var(--dim)}
.sbadge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sbadge.live{background:#FDECEC;color:#C53030}.sbadge.live i,.sbadge.rec i{animation:pulse 1.3s infinite}
.sbadge.rec{background:#E5323F;color:#fff}
.sbadge svg{width:12px;height:12px}
.sbadge{white-space:nowrap;max-width:100%}
.topbar .titles{overflow:hidden}
@media (max-width:560px){#tpic img,#tpic .avatar{width:36px;height:36px}.topbar #actions .btn[data-act=golive]{font-size:0;gap:0;width:38px;padding:0;justify-content:center}.topbar #actions .btn[data-act=golive] .rdot{width:12px;height:12px}}
.ttabs{display:inline-flex;gap:2px;padding:3px;background:var(--muted);border-radius:10px}
.ttabs .tabbtn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--dim)}
.ttabs .tabbtn::after{display:none}
.ttabs .tabbtn svg{width:16px;height:16px}
.ttabs .tabbtn:hover{background:#EEEBF8;color:var(--text)}
.ttabs .tabbtn.on{background:var(--brand-soft);color:var(--brand-ink)}
.ttabs .tabbtn.on .n{background:#fff}
#actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#actions a.btn{text-decoration:none}
@media (max-width:560px){#actions .btn .long{display:none}}
@media (max-width:900px){.ttabs .tabbtn .lbl{display:none}.ttabs .tabbtn{padding:0 10px}}
/* channels in Setup */
.chans{display:flex;flex-direction:column;gap:8px}
.chan{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);min-height:64px}
.chan .logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.chan .logo svg{width:20px;height:20px}
.chan .pic{flex:none;width:40px;height:40px;border-radius:50%;object-fit:cover;background:#EFECF8}
.chan .who{flex:1;min-width:0}
.chan .who b{display:block;font-size:14px;color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .who span{font-size:12px;color:var(--faint)}
.chan input{flex:1;min-width:0}
.chan .main{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap}
.chan .main input{accent-color:var(--brand);width:15px;height:15px;flex:none}
.chan .sbadge{margin:0}
@media (max-width:640px){.chan{flex-wrap:wrap}.chan .main{order:5}}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--brand-ink)}
.topbar p{font-size:12px;color:var(--dim);margin-top:0;overflow-wrap:anywhere}
.icon-btn.menu{display:none}
.content{padding:28px 32px 72px;max-width:1280px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* ---------- collapsed sidebar */
.app.mini{grid-template-columns:76px minmax(0,1fr)}
.app.mini .side-head{flex-direction:column;padding:2px 0 18px}
.app.mini .side-head .logo{display:none}.app.mini .side-head .mark{display:block}
.app.mini .label,.app.mini .count,.app.mini .nav h4,.app.mini .side-card,.app.mini .plans-btn{display:none}
.app.mini .nav-item{justify-content:center;padding:0}
.app.mini .nav-item .live-dot{position:absolute;margin:-20px -22px 0 0}
.avatar.ring{border:2px solid #E5323F;padding:1px;background-clip:content-box}
img.avatar.ring{background:transparent}
.sb-tag{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#FF8A8A;background:rgba(229,50,63,.16);padding:1px 7px 1px 6px;border-radius:5px}
.sb-tag i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
.sb-tag.rec{background:#E5323F;color:#fff}
.nav-item.on .sb-tag{background:#E5323F;color:#fff}
.app.mini .sb-tag{display:none}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:#fff;color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;font-weight:600}
.btn:active{background:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:active{background:var(--brand-press);border-color:var(--brand-press)}
.btn.dark{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.btn.dark svg{color:var(--brand)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;gap:6px}
.btn.sm svg{width:16px;height:16px}
.btn.icon{width:32px;padding:0}
.btn.lg{height:44px;padding:0 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* ---------- fields */
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea){width:100%;height:40px;padding:0 12px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-sm);min-width:0;outline:none;transition:border-color .15s ease}
:where(textarea){height:auto;padding:10px 12px;resize:vertical}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):hover{border-color:#CFCFD3}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):focus{background:#fff;border-color:var(--brand)}
input:not([type=checkbox],[type=radio],[type=range]):focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
label.f{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--dim);font-weight:600}
label.sw{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--text);font-weight:600}
label.sw input{appearance:none;width:38px;height:22px;border-radius:999px;background:#DADADD;position:relative;cursor:pointer;flex:none;margin:0}
label.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
label.sw input:checked{background:var(--brand)}label.sw input:checked::after{transform:translateX(16px)}
label.sw small{display:block;color:var(--dim);font-size:12px;font-weight:400}
label.ck{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:var(--r);cursor:pointer;background:#fff;border:1px solid var(--line-2);font-weight:500}
label.ck:has(input:checked){background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
label.ck input{accent-color:var(--brand);margin:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.span{grid-column:1/-1}

/* ---------- surfaces */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.card>h2,.card-head h2{font-size:15px;font-weight:600;color:var(--brand-ink)}
.card>h2{margin-bottom:4px}
.card>h2+.help{margin-bottom:18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.help,.sub{color:var(--dim);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabbtn{position:relative;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:0;background:transparent;color:var(--faint);cursor:pointer;font-weight:600;font-size:14px;border-radius:10px 10px 0 0;white-space:nowrap}
.tabbtn svg{width:17px;height:17px}
.tabbtn .n{font-size:11px;font-weight:600;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--muted);color:var(--dim);text-align:center;transition:background-color .15s ease,color .15s ease}
.tabbtn::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);opacity:0}
.tabbtn.on{color:var(--brand-ink)}
.tabbtn.on::after{opacity:1;animation:tabin .28s ease}
.tabbtn.on .n{background:var(--brand-soft);color:var(--brand-ink)}

.savebar .btn.ghost{color:#E4E4E7;background:transparent;border-color:transparent}
.savebar .btn.ghost:hover{background:rgba(255,255,255,.08)}
.step .n{width:26px;height:26px;border-radius:999px;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:var(--brand-ink)}
.step b{display:block;font-weight:600;color:var(--text)}
.step .d{font-size:12px;color:var(--dim)}
.step>svg{color:var(--faint);margin-left:auto}
.allset{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--good-soft);color:var(--good);font-weight:600}

/* ---------- jobs + clips */
.job{margin-bottom:36px}
.job-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.jt{display:flex;gap:14px;align-items:center;min-width:0}
.jthumb{position:relative;flex:none;width:128px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--muted);display:grid;place-items:center;color:var(--faint)}
.jthumb img{width:100%;height:100%;object-fit:cover;display:block}
.jthumb>svg{width:22px;height:22px}
.jthumb .du{position:absolute;right:5px;bottom:5px;background:rgba(20,12,8,.82);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
@media (max-width:560px){.jthumb{width:92px}}
.job-head h3{font-size:15px;font-weight:600;overflow-wrap:anywhere;color:var(--brand-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;background:var(--muted);border-radius:999px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .8s ease}
.err{color:var(--bad);font-size:13px;overflow-wrap:anywhere;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.clip{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:9/16;background:#111113;border:0;padding:0;cursor:pointer;display:block;width:100%;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .veil{position:absolute;left:10px;bottom:10px}
.veil span{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink)}
.veil svg{width:15px;height:15px;margin-left:2px}
.badge{position:absolute;top:10px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:#fff;color:var(--brand-ink)}
.badge.l{left:10px}.badge.r{right:10px}
.badge.s-hi{background:var(--brand);color:var(--brand-ink)}.badge.s-mid{background:#FFE3CC;color:var(--brand-ink)}
.making{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--dim);font-size:13px;font-weight:500;background:linear-gradient(110deg,#F3F1FA 30%,#FAFAFA 50%,#F3F1FA 70%);background-size:220% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.clip-body{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.hook{font-weight:600;font-size:13px;color:var(--brand-ink)}
.ttl{color:var(--dim);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.selck{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;cursor:pointer;flex:none;transition:background-color .15s ease}
.selck:hover{background:var(--brand-soft)}
.selck input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;margin:0}
.clip.picked{border-color:var(--brand)}
#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 24px);padding:10px 12px 10px 18px;border-radius:14px;background:#1F140D;color:#FFF4EA;font-size:14px;border:1px solid rgba(255,178,122,.25)}
#selbar.on{display:flex}
#selbar b{font-weight:700;margin-right:6px}
#selbar .btn{background:transparent;color:#FFF4EA;border-color:rgba(255,244,234,.25)}
#selbar .btn:hover{background:rgba(255,244,234,.1)}
#selbar .btn.primary{background:var(--brand);color:#1F140D;border-color:var(--brand)}
#selbar .btn.primary:hover{background:#FFA25C}
#selbar .btn.danger{color:#FF9A8F;border-color:rgba(255,154,143,.45)}
#selbar .btn.danger:hover{background:rgba(255,154,143,.14)}
.danger-card{border-color:#F3C9C4}
.danger-card h2{color:var(--bad)}
.clip-foot{display:flex;gap:4px;align-items:center;margin-top:auto;padding-top:8px}

/* ---------- live */
.livecard{background:#fff;border:1px solid #F4C9CD;border-radius:var(--r);padding:20px;margin-bottom:28px}
.lc-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.lc-title{flex:1;min-width:0}
.lc-title h3{margin-top:8px;font-size:16px;line-height:1.4;color:var(--brand-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lc-acts{flex:none;display:flex;gap:8px;align-items:center}
.lc-acts .btn{height:40px}
@media (max-width:900px){.lc-head{flex-direction:column}.lc-acts{width:100%}.lc-acts .btn{flex:1;justify-content:center}}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0}
.stat b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.evbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 0;border:0;background:transparent;font:inherit;font-size:20px;font-weight:600;color:var(--brand-ink);cursor:pointer;border-radius:8px;transition:color .15s ease}
.evbtn:hover,.evpick.open .evbtn{color:var(--brand)}
.evbtn .car{width:14px;height:14px;color:var(--faint)}
.evpick .pick-menu{min-width:240px}
.pick-opt .ph{font-size:11px;color:#9C8A7E;margin-left:6px}
.stat .evpick .pick-opt .pl{font-size:13px;color:inherit}.stat .evpick .pick-opt .ph{font-size:11px;color:#9C8A7E}.stat .evpick .evbtn .pv{font-size:20px;color:inherit}
.autonote{font-size:12px;color:var(--faint);margin:-8px 0 14px}.stat span{font-size:12px;color:var(--dim)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.meter{background:var(--muted);border-radius:var(--r);padding:12px 14px}
.meter h4{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:9px}
.spark{display:flex;align-items:flex-end;gap:1px;height:46px}
.spark i{flex:1;background:var(--brand);min-height:2px;border-radius:1px}.spark.chat i{background:var(--good)}
.said{font-size:13px;color:var(--faint);height:76px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.said div:last-child{color:var(--text)}

/* ---------- tables + logs */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--faint);padding:0 10px 10px;white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
a.lnk{color:var(--brand-ink);text-decoration:none;font-weight:600}
.log{display:flex;flex-direction:column}
.log div{display:flex;gap:14px;padding:11px 0;font-size:13px}
.log div+div{border-top:1px solid var(--line)}
.log time{color:var(--faint);white-space:nowrap;flex:none;width:118px}

/* ---------- plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:var(--r);background:#fff;border:1px solid var(--line-2);cursor:pointer;font-size:13px;color:var(--dim)}
.plan b{font-size:16px;font-weight:600;color:var(--brand-ink);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.plan b svg{color:var(--brand)}
.plan em{position:absolute;top:16px;right:16px;font-style:normal;font-size:11px;font-weight:600;background:var(--brand-ink);color:var(--brand);padding:2px 8px;border-radius:999px}
.plan input{position:absolute;opacity:0;pointer-events:none}
.plan.on{background:var(--brand-soft);border-color:var(--brand)}
.plan:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}

/* ---------- dialogs + toasts */
dialog{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:var(--r-lg);padding:0;max-width:calc(100vw - 32px)}
dialog::backdrop{background:rgba(14,12,11,.42);animation:fadein .16s ease}
.dlg{padding:24px;width:450px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:18px;font-weight:600;color:var(--brand-ink)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.editor{display:grid;grid-template-columns:minmax(240px,340px) minmax(300px,450px);max-height:calc(100vh - 48px)}
.editor .stage{background:#111113;display:grid;place-items:center;position:relative;min-height:320px}
.editor video,.editor .stage img{width:100%;max-height:calc(100vh - 48px);aspect-ratio:9/16;object-fit:contain;display:block}
.editor .panel{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.editor h3{font-size:13px;font-weight:600;color:var(--dim);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--frame);color:var(--frame-text);border:1px solid var(--frame-2);border-radius:var(--r);padding:12px 16px;max-width:380px;animation:rise .2s ease;display:flex;gap:10px;align-items:center;font-weight:500}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.toast.ok::before{background:#3DDC97}.toast.bad::before{background:#FF6B78}
.toast .rep{margin-left:auto;border:0;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.toast .rep:hover{background:rgba(255,255,255,.18)}
.err .rep{margin-left:8px;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}

.ntoast{display:flex;gap:12px;align-items:flex-start;width:340px;max-width:calc(100vw - 40px);padding:12px 12px 12px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--text);cursor:pointer;text-align:left;
  animation:ntin .35s cubic-bezier(.2,.8,.2,1) both;transition:background-color .15s ease}
.ntoast:hover{background:#FAFAFA}
.ntoast.out{animation:ntout .25s ease forwards}
.ntoast i{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep)}
.ntoast i svg{width:17px;height:17px}
.ntoast.k-expiry i{background:#FFF1DC;color:#9A5B12}.ntoast.k-post i{background:#FDECEC;color:#C53030}.ntoast.k-live i{background:#FDECEC;color:#E5323F}.ntoast.k-clips i{background:#E9F6EE;color:#1F7A4D}
.ntoast .tx{flex:1;min-width:0}
.ntoast b{display:block;font-size:13px;font-weight:600;color:var(--brand-ink);line-height:1.35}
.ntoast span{display:block;font-size:12px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.ntoast .x{flex:none;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer}
.ntoast .x:hover{background:var(--muted);color:var(--text)}
.ntoast .x svg{width:12px;height:12px}
@keyframes ntin{from{opacity:0;transform:translateX(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ntout{to{opacity:0;transform:translateX(24px)}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}

.me{display:flex;align-items:center;gap:8px;padding:10px 2px 0 6px;margin-top:8px;border-top:1px solid var(--frame-line)}
.me .me-pic{width:30px;height:30px;font-size:14px;object-fit:cover;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.me-btn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:4px;margin:-4px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;cursor:pointer;transition:background-color .15s ease}
.me-btn:hover,.me-btn[aria-expanded=true]{background:var(--frame-2)}
.bell{position:relative}
.bell .dotn{position:absolute;top:2px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#E5323F;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--frame)}
.pop{position:fixed;z-index:60;left:248px;bottom:12px;width:360px;max-width:calc(100vw - 24px);max-height:min(520px,calc(100vh - 100px));display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  opacity:0;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease}
.pop.open{opacity:1;transform:none}
@media (max-width:900px){.pop{left:12px!important;bottom:74px!important;z-index:80}}
.pop-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.pop-head h3{font-size:15px;color:var(--brand-ink);flex:1}
.pop-head button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px}
.pop-head button:hover{color:var(--brand-ink);background:var(--muted)}
.pop-list{overflow-y:auto;padding:0 6px 6px;scrollbar-width:thin}
.nt{display:flex;gap:12px;width:100%;padding:10px;border:0;border-radius:10px;background:transparent;text-align:left;cursor:pointer;transition:background-color .15s ease}
.nt:hover{background:var(--muted)}
.nt i{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep)}
.nt i svg{width:16px;height:16px}
.nt.k-expiry i{background:#FFF1DC;color:#9A5B12}.nt.k-post i,.nt.k-fail i{background:#FDECEC;color:#C53030}.nt.k-live i{background:#FDECEC;color:#E5323F}.nt.k-clips i{background:#E9F6EE;color:#1F7A4D}
.nt .tx{flex:1;min-width:0}
.nt b{display:block;font-size:13px;font-weight:600;color:var(--brand-ink);line-height:1.35}
.nt span{display:block;font-size:12px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.nt small{display:block;font-size:11px;color:var(--faint);margin-top:3px}
.nt.new b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-left:6px;vertical-align:middle}
.pop-empty{padding:28px 20px 34px;text-align:center;color:var(--faint);font-size:13px}
.pop-empty svg{width:28px;height:28px;color:var(--line-2);display:block;margin:0 auto 8px}
.pop.menu{width:240px;padding:6px}
.pop.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--text);font-size:14px;cursor:pointer;text-align:left;transition:background-color .15s ease}
.pop.menu button:hover{background:var(--muted)}
.pop.menu button svg{width:16px;height:16px;color:var(--dim)}
.pop.menu .who2{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.pop.menu .who2 b{display:block;font-size:13px;color:var(--brand-ink)}.pop.menu .who2 span{font-size:12px;color:var(--faint);overflow-wrap:anywhere}
.pop.menu .danger{color:#C53030}.pop.menu .danger svg{color:#C53030}
.me .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.me .who b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who span{font-size:12px;color:var(--frame-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app.mini .me .who{display:none}.app.mini .me{flex-direction:column;padding:10px 0 0}

/* ---------- AI status and usage */
.ai-card{display:flex;align-items:center;gap:10px;width:100%;margin-top:6px;padding:8px;border-radius:8px;background:var(--frame-2);border:1px solid transparent;color:var(--frame-text);cursor:pointer;text-align:left}
.ai-card .ai-ic{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:rgba(139,92,246,.16);color:var(--brand)}
.ai-card .ai-ic svg{width:18px;height:18px}
.ai-card .ai-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.ai-card small{font-size:12px;color:var(--frame-dim);font-weight:500}
.ai-card b{font-size:14px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-card .ai-n{font-size:12px;color:var(--frame-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.app.mini .ai-card{justify-content:center;padding:6px 0;background:transparent;border-color:transparent}
.app.mini .ai-card .ai-tx,.app.mini .ai-card .ai-n{display:none}
.ai-home{display:flex;flex-direction:column;background:#fff;color:var(--text);border-color:var(--line)}
.ai-home h2{font-size:13px;font-weight:500;color:var(--dim);margin-bottom:6px}
.ai-big{font-size:28px;font-weight:600;letter-spacing:-.02em;color:var(--brand-ink);line-height:1.15;overflow-wrap:anywhere}
.ai-sub{font-size:12px;color:var(--faint);margin:4px 0 14px;overflow-wrap:anywhere}
.ai-stats{display:flex;flex-direction:column;margin-bottom:16px;border-top:1px solid var(--line)}
.ai-stats div{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.ai-stats b{order:2;font-size:14px;font-weight:600;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.ai-stats span{order:1;font-size:13px;color:var(--dim)}
.ai-home .row{margin-top:auto;display:flex;gap:8px;align-items:center}
.ai-home .row .btn{height:38px;border:0;background:transparent;color:var(--dim);padding:0 8px;font-size:14px}
.ai-home .row .btn:hover{color:var(--brand-ink);background:var(--muted)}

.stack{display:flex;flex-direction:column;gap:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;margin:8px 0 6px;cursor:pointer;
  background:linear-gradient(90deg,var(--brand) 0 var(--p,5%),var(--line) var(--p,5%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:6px solid var(--brand)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:6px solid var(--brand)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--muted);color:var(--dim);font-size:13px;margin-top:14px}
.note svg{color:var(--brand-deep);margin-top:1px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.split>.card{margin-bottom:16px}
.hbar{display:flex;flex-direction:column;gap:12px}
.hbar-row .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.hbar-row .top span:last-child{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar-row .track{height:8px;background:var(--muted);border-radius:999px;overflow:hidden}
.hbar-row .track i{display:block;height:100%;background:var(--brand);border-radius:999px}
.tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}

@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- motion and hover: colour only, never size */
.btn,.nav-item,.chip,.step,.tabbtn,.icon-btn,label.ck,.clip,a.lnk,.ai-card,.veil span,td,label.sw input{transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.btn:hover{background:var(--muted);border-color:#D3CEE6}
.btn.primary:hover{background:#9D74F8;border-color:#9D74F8}
.btn.dark:hover{background:#2A2A2E;border-color:#2A2A2E}
.btn.danger:hover{background:#FADDE0}
.btn.ghost:hover{background:var(--muted);border-color:transparent;color:var(--text)}

.nav-item:hover{background:var(--frame-2)}
.nav-item.on:hover{background:#9D74F8}
.icon-btn:hover{background:var(--muted);color:var(--text)}
.side .icon-btn:hover{background:var(--frame-2);color:var(--frame-text)}
.chip:hover{background:var(--muted);color:var(--text)}
.chip.on:hover,.pick.open .chip:hover{background:#E7DDFF;color:var(--brand-ink)}
.step:hover{background:#EFECF8}
.tabbtn:hover{color:var(--brand-ink);background:var(--muted)}
label.ck:hover{border-color:#D3CEE6}
.clip:hover{border-color:var(--line-2)}
.shot:hover .veil span{background:#9D74F8}
a.lnk:hover{color:var(--brand-deep)}
tr:hover>td{background:#FAFAFA}
.ai-card:hover{background:#FAFAFA}
.ai-card.on{border-color:rgba(139,92,246,.5)}
.app.mini .ai-card:hover{background:var(--frame-2)}
dialog[open]{animation:fadein .16s ease}
@keyframes fadein{from{opacity:0}}

/* ---------- refreshed look: light frame, white panels, quiet borders, dark buttons with a soft gradient */
main{margin:10px 10px 10px 0;height:calc(100vh - 20px);border:1px solid var(--line);border-radius:18px}
.topbar{padding:12px 28px;min-height:60px}
.side{padding:16px 12px 14px}
.side-head{padding:2px 4px 18px 8px}
.side-head .logo{height:30px}
.nav{gap:3px}
.nav h4{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:18px 10px 6px}
.nav-item{min-height:38px;border-radius:10px;border:1px solid transparent;color:var(--dim)}
.nav-item svg{color:var(--faint)}
.nav-item:hover{background:rgba(0,0,0,.04);color:var(--text)}
.nav-item.on,.nav-item.on:hover{background:#fff;border-color:var(--line);color:var(--text);font-weight:500}
.nav-item.on svg{color:var(--brand)}
.count,.nav-item.on .count{background:#E9E6F5;color:var(--dim)}
.avatar{background:var(--brand-soft);color:var(--brand-deep)}
img.avatar{background:var(--muted)}
.nav-item.on .avatar{background:var(--brand);color:#fff}
.sb-tag{color:#C53030;background:#FDECEC}
.ai-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px}
.ai-card:hover{background:#FAFAFA;border-color:var(--line-2)}
.ai-card.on{border-color:var(--brand-line)}
.ai-card .ai-ic{background:var(--brand-soft);color:var(--brand)}
.me-btn{border-radius:10px}
/* collapsed sidebar: icon over a small label, like a tool rail */
.app.mini{grid-template-columns:88px minmax(0,1fr)}
.app.mini .nav-item{flex-direction:column;justify-content:center;gap:5px;min-height:60px;padding:8px 4px}
.app.mini .nav-item .label{display:block;flex:none;max-width:100%;font-size:11px;line-height:1.2;text-align:center}
.app.mini .nav-item svg{width:19px;height:19px}

/* buttons */
.btn{height:36px;border-radius:10px;font-weight:500;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.btn:hover{background:#FAFAFA;border-color:#D3CEE6}
.btn:active{transform:scale(.97);background:var(--muted)}
.btn.sm{height:32px;border-radius:9px}
.btn.lg{height:44px;border-radius:12px}
.btn.primary,.btn.dark{background:linear-gradient(180deg,#36363B 0%,#0F0F14 100%);border-color:#0F0F14;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.btn.primary:hover,.btn.dark:hover{background:linear-gradient(180deg,#44444A 0%,#1E1E21 100%);border-color:#1E1E21}
.btn.primary:active,.btn.dark:active{background:linear-gradient(180deg,#232326 0%,#0E0E10 100%)}
.btn.primary:disabled{background:#EEEBF8;border-color:#EEEBF8;color:#9D99B2;box-shadow:none}
.btn.dark svg{color:#B79CFB}
.icon-btn{border-radius:10px}

/* cards and surfaces */
.card{border-radius:16px;padding:22px 24px}
.tile{border-radius:16px;padding:18px 20px}
.tile i{width:34px;height:34px;border-radius:10px;background:var(--muted);color:var(--text)}
.clip{border-radius:14px}
.appcard{border-radius:14px}
dialog{border-radius:18px}
.composer{border-radius:18px;border-color:var(--line-2)}
.composer:has(#url:focus){border-color:#C6C0DD}
.composer.over{border-color:var(--brand)}
.chip{border:1px solid transparent}
.chip.on,.pick.open .chip,.chip.on:hover,.pick.open .chip:hover{background:#fff;border-color:var(--line-2);color:var(--text)}
.vb{background:var(--muted);color:var(--text);border:1px solid var(--line)}
.vb svg{color:var(--brand)}.vb b{color:var(--text)}
.toast{background:#161618;color:#F3F1FA;border-color:#161618}

/* segmented controls: a grey track with a white tile for the chosen one */
.utabs{background:var(--muted);border-radius:12px}
.utabs .ind{background:#fff;border:1px solid var(--line-2)}
.utabs .tabbtn:hover{background:transparent;color:var(--text)}
.utabs .tabbtn.on,.utabs .tabbtn.on svg{color:var(--text)}
.utabs .tabbtn .n,.utabs .tabbtn.on .n{background:#E9E6F5;color:var(--dim)}
.ttabs .tabbtn:hover{background:transparent;color:var(--text)}
.ttabs .tabbtn.on{background:#fff;color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
.seg button:hover{background:var(--muted)}
.seg button[aria-pressed=true]{background:#0F0F14;color:#fff}
.seg button[aria-pressed=true] small{color:#9D99B2}
.tile-o[aria-pressed=true]{background:#fff;color:var(--text);box-shadow:inset 0 0 0 1.5px #0F0F14}
label.ck:has(input:checked){background:#fff;border-color:#0F0F14;color:var(--text)}
.set-link.on{background:var(--muted)}.set-link.on svg{color:var(--brand)}
.tabbtn.on svg{color:var(--brand)}
@media (max-width:900px){main{border:0}}

/* ---------- SaaS sidebar: New clip button and quiet section labels */
.new-clip{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;margin:0 0 6px;border-radius:11px;border:1px solid #0F0F14;
  background:linear-gradient(180deg,#36363B 0%,#0F0F14 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);color:#fff;font-weight:500;cursor:pointer;
  transition:background-color .15s ease,transform .16s var(--ease-out)}
.new-clip svg{width:17px;height:17px}
.new-clip:hover{background:linear-gradient(180deg,#44444A 0%,#1E1E21 100%)}
.new-clip:active{transform:scale(.97)}
.nav h4:first-of-type{padding-top:12px}
.app.mini .new-clip{width:44px;height:44px;margin:0 auto 6px;border-radius:12px}
.app.mini .new-clip .label{display:none}

/* ---------- creators page: one card per creator */
.crgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.crcard{display:flex;flex-direction:column;gap:16px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--text);text-align:left;cursor:pointer;
  font:inherit;transition:border-color .15s ease,background-color .15s ease,transform .16s var(--ease-out)}
.crcard:hover{border-color:var(--line-2);background:#FCFCFC}
.crcard:active{transform:scale(.985)}
.crtop{display:flex;align-items:center;gap:12px;min-width:0}
.crtop .avatar{width:48px;height:48px;font-size:18px}
.crname{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.crname b{font-size:16px;font-weight:600;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crname .sbadge{margin:0}
.crplats{display:flex;gap:6px;min-height:28px;align-items:center}
.crplats .logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.crplats .logo svg{width:15px;height:15px}
.crstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:14px}
.crstats span{display:flex;flex-direction:column;font-size:12px;color:var(--dim)}
.crstats b{font-size:17px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.crcard.add{align-items:center;justify-content:center;text-align:center;gap:8px;border-style:dashed;border-color:var(--line-2);background:transparent;min-height:190px;color:var(--dim)}
.crcard.add:hover{background:#fff;border-color:#C6C0DD}
.crcard.add b{color:var(--text);font-size:15px;font-weight:600}
.crcard.add>span:last-child{font-size:13px;max-width:240px}
.addic{width:40px;height:40px;border-radius:12px;background:var(--muted);color:var(--text);display:grid;place-items:center}

/* ---------- recent clips on Home */
.rclips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.rclip{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:transparent;color:var(--text);text-align:left;cursor:pointer;font:inherit}
.rshot{position:relative;display:block;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#111113}
.rshot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s var(--ease-out)}
.rclip:hover .rshot img{transform:scale(1.03)}
.rshot .du{position:absolute;right:6px;top:6px;background:rgba(14,14,16,.78);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px}
.rclip b{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:1100px){.rclips{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.rclips{grid-template-columns:repeat(2,minmax(0,1fr))}.crgrid{grid-template-columns:1fr}}

/* ---------- clip editor: dark, full screen (the code is in editor.js) */
#clipdlg.ed-on{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;border-radius:0;padding:0;background:#0C0C0F;color:#ECECEF}
#clipdlg.ed-on::backdrop{background:#0C0C0F}
.ed{--ed-bg:#0C0C0F;--ed-panel:#141418;--ed-card:#1B1B21;--ed-line:rgba(255,255,255,.08);--ed-line-2:rgba(255,255,255,.14);--ed-dim:#9A9AA6;--ed-faint:#6B6B76;--ed-accent:#8B7CF6;--ed-accent-2:#B39DFF;
  height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--ed-bg);font-size:13px}
.ed svg{width:16px;height:16px}
.ed-loading{grid-row:1/-1;display:grid;place-items:center;color:var(--ed-dim)}
.ed-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--ed-line)}
.ed-name{display:flex;align-items:center;gap:10px;min-width:0}
.ed-name b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-tabs{display:flex;gap:2px;padding:3px;background:var(--ed-panel);border:1px solid var(--ed-line);border-radius:12px}
.ed-tabs button{height:32px;padding:0 16px;border:0;border-radius:9px;background:transparent;color:var(--ed-dim);font:inherit;font-weight:500;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.ed-tabs button:hover{color:#fff}
.ed-tabs button[aria-selected=true]{background:var(--ed-card);color:#fff;box-shadow:inset 0 0 0 1px var(--ed-line-2)}
.ed-acts{display:flex;gap:8px;align-items:center}
.ed-ib{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--ed-line);border-radius:10px;background:var(--ed-panel);color:#ECECEF;cursor:pointer;flex:none;font:inherit;font-size:16px;
  transition:background-color .15s ease,transform .16s var(--ease-out)}
.ed-ib:hover{background:var(--ed-card)}.ed-ib:active{transform:scale(.95)}
.ed-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--ed-line-2);border-radius:10px;background:var(--ed-card);color:#ECECEF;
  font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .15s ease,border-color .15s ease,transform .16s var(--ease-out)}
.ed-btn:hover{background:#23232A}.ed-btn:active{transform:scale(.97)}
.ed-btn.primary{background:linear-gradient(180deg,#9C8FFA 0%,#7B68EE 100%);border-color:#7B68EE;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.ed-btn.primary:hover{background:linear-gradient(180deg,#AA9EFF 0%,#8674F2 100%)}
.ed-btn:disabled{opacity:.45;pointer-events:none}
.ed-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:var(--ed-card);color:var(--ed-dim);font-size:11px;font-weight:500;white-space:nowrap}
.ed-pill svg{width:12px;height:12px}
.ed-pill.ok{color:#5BD69A}
.ed-pill.busy{color:var(--ed-accent-2)}.ed-pill.busy i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
.ed-menu{position:relative}
.ed-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:5;width:260px;padding:6px;background:var(--ed-card);border:1px solid var(--ed-line-2);border-radius:12px;transform-origin:top right;animation:edpop .16s var(--ease-out)}
@keyframes edpop{from{opacity:0;transform:scale(.96)}}
.ed-pop a,.ed-pop button{display:flex;gap:10px;align-items:flex-start;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:#ECECEF;font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.ed-pop a:hover,.ed-pop button:hover{background:rgba(255,255,255,.06)}
.ed-pop svg{margin-top:2px;color:var(--ed-dim)}
.ed-pop b{display:block;font-weight:500}.ed-pop small{display:block;color:var(--ed-faint);font-size:12px}
.ed-body{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:0}
.ed-panel{border-right:1px solid var(--ed-line);overflow-y:auto;padding:6px 16px 24px;scrollbar-width:thin;scrollbar-color:#2A2A31 transparent}
.ed-sec{padding:14px 0;border-bottom:1px solid var(--ed-line);display:grid;gap:10px}
.ed-sec:last-child{border-bottom:0}
.ed-sec h3{font-size:13px;font-weight:600;color:#fff}
.ed-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ed-help{color:var(--ed-faint);font-size:12px;line-height:1.45}
.ed-link{border:0;background:transparent;color:var(--ed-accent-2);font:inherit;font-size:12px;cursor:pointer;padding:0}
.ed-link:hover{color:#fff}
.ed input:not([type]),.ed input[type=text],.ed textarea,.ed select,#edBrandName,#edHook,#edTitle{width:100%;height:36px;padding:0 11px;border:1px solid var(--ed-line-2);border-radius:9px;background:var(--ed-panel);color:#ECECEF;font:inherit;outline:none;transition:border-color .15s ease}
.ed textarea{height:auto;padding:9px 11px;resize:vertical}
.ed input:focus,.ed textarea:focus,.ed select:focus{border-color:var(--ed-accent)}
.ed input:disabled{opacity:.45}
.ed select option{background:#1B1B21}
.ed-f{display:grid;gap:7px;color:var(--ed-dim);font-size:12px}
.ed-f output{float:right;color:#fff;font-variant-numeric:tabular-nums}
.ed input[type=range]{width:100%;accent-color:var(--ed-accent);height:20px}
.ed-row{display:flex;gap:8px}.ed-row input{flex:1;min-width:0}
.ed-seg{display:flex;gap:2px;padding:3px;background:var(--ed-panel);border:1px solid var(--ed-line);border-radius:10px}
.ed-seg button{flex:1;height:30px;border:0;border-radius:7px;background:transparent;color:var(--ed-dim);font:inherit;font-weight:500;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.ed-seg button:hover{color:#fff}
.ed-seg button[aria-pressed=true]{background:var(--ed-card);color:#fff;box-shadow:inset 0 0 0 1px var(--ed-line-2)}
.ed-presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ed-preset{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px 6px 8px;border:1px solid var(--ed-line);border-radius:11px;background:var(--ed-panel);color:var(--ed-dim);font:inherit;font-size:11px;cursor:pointer;
  transition:border-color .15s ease,color .15s ease,transform .16s var(--ease-out)}
.ed-preset:hover{border-color:var(--ed-line-2);color:#fff}.ed-preset:active{transform:scale(.97)}
.ed-preset.on{border-color:var(--ed-accent);color:#fff}
.ed-preset b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-ps{position:relative;display:flex;align-items:flex-end;justify-content:center;aspect-ratio:4/5;padding-bottom:14px;border-radius:8px;overflow:hidden;background:#15131C}
.ed-ps i{position:absolute;inset:-10px;background-size:cover;background-position:center;filter:blur(5px) brightness(.55) saturate(1.1)}
.ed-ps::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.35))}
.ed-pt{position:relative;z-index:1;font-size:16px;line-height:1;white-space:nowrap;paint-order:stroke fill}
.ed-pt em{display:inline-block;font-style:normal;transform:scale(1.12);margin-left:2px}
.ed-preset small{font-size:10px;color:var(--ed-faint);margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff;opacity:0;transition:opacity .15s ease}
.ed-x svg{width:11px;height:11px}
.ed-preset:hover .ed-x{opacity:1}
.ed-sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ed-sw button,.ed-pick{width:24px;height:24px;border-radius:7px;border:1px solid var(--ed-line-2);cursor:pointer;padding:0;transition:transform .16s var(--ease-out)}
.ed-sw button:active{transform:scale(.9)}
.ed-sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ed-bg),0 0 0 4px var(--ed-accent)}
.ed-pick{position:relative;overflow:hidden;background-image:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)!important;border:0}
.ed-pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ed-sw2{position:relative;display:inline-flex}
.ed-sw2 input{position:absolute;opacity:0;inset:0;cursor:pointer}
.ed-sw2 span{width:36px;height:20px;border-radius:999px;background:#2A2A31;position:relative;transition:background-color .15s ease}
.ed-sw2 span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s var(--ease-out)}
.ed-sw2 input:checked+span{background:var(--ed-accent)}.ed-sw2 input:checked+span::after{transform:translateX(16px)}
.ed-lines{display:grid;gap:4px;padding-top:6px}
.ed-line{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px;align-items:center}
.ed-line input{height:34px;background:transparent;border-color:transparent}
.ed-line input:hover{border-color:var(--ed-line)}
.ed-t{height:26px;border:0;border-radius:6px;background:var(--ed-panel);color:var(--ed-dim);font:inherit;font-size:11px;font-variant-numeric:tabular-nums;cursor:pointer}
.ed-t:hover{color:#fff;background:var(--ed-card)}
.ed-trim{display:flex;align-items:center;gap:8px}
.ed-trim b{min-width:64px;text-align:center;font-size:16px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.ed-stat{display:flex;justify-content:space-between;align-items:baseline;color:var(--ed-dim)}.ed-stat b{font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.ed-accs{display:grid;gap:6px}
.ed-acc{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--ed-line);border-radius:9px;cursor:pointer}
.ed-acc input{accent-color:var(--ed-accent)}
.ed-posts:empty{display:none}
/* the preview */
.ed-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px;min-height:0;
  background:radial-gradient(60% 50% at 50% 40%,rgba(139,124,246,.10),transparent 70%)}
.ed-views{display:flex;gap:2px;padding:3px;background:var(--ed-panel);border:1px solid var(--ed-line);border-radius:10px}
.ed-views button{height:28px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--ed-dim);font:inherit;font-size:12px;cursor:pointer}
.ed-views button[aria-pressed=true]{background:var(--ed-card);color:#fff;box-shadow:inset 0 0 0 1px var(--ed-line-2)}
.ed-views button:disabled{opacity:.4;cursor:default}
.ed-phone{position:relative;height:100%;max-height:calc(100vh - 290px);aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--ed-line-2)}
.ed-bg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(22px) brightness(.62) saturate(1.15)}
.ed-bg.none{display:none}
.ed-fg{position:absolute;left:0;top:50%;width:100%;transform:translateY(-50%);object-fit:cover;cursor:pointer}
.ed-done{width:100%;height:100%;object-fit:contain;display:block;cursor:pointer}
.ed-cap{position:absolute;left:50%;white-space:nowrap;line-height:1;paint-order:stroke fill;pointer-events:none;transform-origin:center}
.ed-cap span{display:inline-block;transition:transform .09s ease-out}
.ed-cap span.on{transform:scale(1.08)}
.ed-hook{position:absolute;left:50%;transform:translate(-50%,-50%);max-width:83%;padding:calc(var(--k,.3)*22px) calc(var(--k,.3)*36px);border-radius:calc(var(--k,.3)*26px);background:#fff;color:#14100E;
  font:800 calc(var(--k,.3)*70px)/1.15 "Poppins",sans-serif;text-align:center;text-wrap:balance;pointer-events:none}
.ed-making{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;background:rgba(12,12,15,.78);color:#fff;font-weight:500}
.ed-making i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ed-accent-2);border-right-color:transparent;animation:spin .8s linear infinite}
/* the timeline */
.ed-tl{border-top:1px solid var(--ed-line);padding:8px 14px 14px;background:var(--ed-panel)}
.ed-tl-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ed-now{font-variant-numeric:tabular-nums;color:#fff;font-weight:500}
.ed-tl-note{margin-left:auto;color:var(--ed-faint);font-size:12px}
