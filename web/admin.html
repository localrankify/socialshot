<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SocialShot Admin</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=5">
<meta name="theme-color" content="#0C0C0E">
<link rel="stylesheet" href="/assets/ui.css?v=3">
<style>
/* the admin dashboard: the app's own sidebar, panel and cards (the shared look is in ui.css) */
:root{--brand-deep:var(--accent-ink)}
html,body{height:100%}
body{font-size:14px;line-height:1.5;overflow:hidden}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}
.side{display:flex;flex-direction:column;height:100vh;padding:14px 10px 12px;min-width:0;background:var(--s0)}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px 18px}
.side-head .logo{height:26px;width:auto;display:block}
.side-head .pill{height:20px;font-size:10.5px;padding:0 7px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.nav h4{font-size:11.5px;font-weight:500;color:var(--faint);padding:10px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:var(--r);border:0;background:transparent;color:var(--dim);font-size:14px;font-weight:500;
  cursor:pointer;text-align:left;text-decoration:none;transition:background-color .15s ease,color .15s ease}
.nav-item svg{width:17px;height:17px;color:var(--mute);transition:color .15s ease}
.nav-item:hover{background:var(--s2);color:var(--text)}
.nav-item:hover svg{color:var(--dim)}
.nav-item.on,.nav-item.on:hover{background:var(--s4);color:#fff}
.nav-item.on svg{color:#fff}
.nav-item .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px;border-radius:999px;background:var(--s3);color:var(--dim);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.nav-item.on .count{background:rgba(255,255,255,.12);color:#fff}
.side-foot{display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;padding:10px 8px 6px;min-width:0}
.who i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-style:normal;font-weight:600;font-size:13px}
.who>span{min-width:0;font-size:12px;color:var(--mute);line-height:1.35}
.who b{display:block;font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* the page: one panel beside the sidebar, on the same dark sheet as the app */
main{margin:8px 8px 8px 0;border:1px solid var(--line);border-radius:var(--r-panel);height:calc(100vh - 16px);overflow-y:auto;min-width:0;scrollbar-gutter:stable}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:22px 32px 6px}
.topbar .titles{flex:1;min-width:0}
.topbar h1{font-size:20px;font-weight:600;letter-spacing:-.015em;color:#fff}
.topbar p{margin-top:2px;font-size:13px;color:var(--mute)}
.content{padding:18px 32px 64px;max-width:1360px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=number],textarea{height:38px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--s1);color:var(--text);width:100%;outline:none;transition:border-color .15s ease}
input:hover,textarea:hover{border-color:var(--line-3)}
input:focus,textarea:focus{border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--dim);font-weight:500}

/* cards and metric tiles: the same as the metric cards on the app's Home */
.card{padding:18px 20px;margin-bottom:12px}
.help,.sub{color:var(--mute);font-size:13px}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:#fff;font-size:15px;font-weight:500;margin-bottom:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.tile{display:grid;grid-template-rows:auto auto 1fr;gap:6px;padding:16px 18px 14px;border:1px solid var(--line-2);border-radius:var(--r-card);background:var(--card);min-width:0}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
.tile-top span{font-size:13px;font-weight:500;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-top svg{width:16px;height:16px;color:var(--faint)}
.tile b{font-family:var(--font-head);font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.02em;color:#fff;font-variant-numeric:tabular-nums}
.tile small{align-self:end;font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split>.card{margin-bottom:12px;min-width:0}

.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{font:11px var(--font);fill:var(--faint)}
.chart .b1{fill:#4A4A52;transition:fill .15s ease}
.chart .b1:hover{fill:#6B6B75}
.chart .b1.now{fill:var(--accent)}
.chart .none{font-size:13px;fill:var(--mute)}
.hbar{display:flex;flex-direction:column;gap:14px}
.hbar-row .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:7px;color:var(--text-2)}
.hbar-row .top span:last-child{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar-row .track{height:6px;background:var(--s3);border-radius:999px;overflow:hidden}
.hbar-row .track i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* tables */
.scroll{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--mute);padding:0 12px 10px;white-space:nowrap}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle;color:var(--text-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.acts{text-align:right;white-space:nowrap}
tr.u{cursor:pointer}
tr.u>td{transition:background-color .15s ease}
tr.u:hover>td{background:var(--s3)}
td .em{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
td b{color:#fff;font-weight:500}
td .pill{vertical-align:1px;margin-left:4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{max-width:320px}
.price{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--s1);flex:none;transition:border-color .15s ease}
.price span{color:var(--mute);font-weight:500}
.price input,.price input:focus,.price input:hover{width:90px;height:36px;border:0;padding:0;background:transparent;font-variant-numeric:tabular-nums}
.price small{font-size:12px;color:var(--faint);white-space:nowrap}
.price:focus-within{border-color:var(--accent)}
.seg{display:flex;gap:2px;padding:3px;background:var(--s2);border:1px solid var(--line);border-radius:10px}
.seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--mute);font-size:13px;font-weight:500;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--s4);color:#fff}

/* dialogs and toasts */
dialog{border:1px solid var(--line-2);background:var(--s2);color:var(--text);border-radius:var(--r-panel);padding:0;max-width:calc(100vw - 32px)}
dialog::backdrop{background:rgba(6,6,8,.66)}
dialog[open]{animation:dlg-in .22s var(--ease)}
@keyframes dlg-in{from{opacity:0;transform:translateY(6px) scale(.98)}}
.dlg{padding:22px;width:460px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.dlg.wide{width:740px;max-height:calc(100vh - 48px);overflow:auto}
.dlg h2{font-size:18px;font-weight:600;color:#fff}
.dlg h3{font-size:13px;font-weight:500;color:var(--dim);margin-top:6px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.facts div{background:var(--s3);border-radius:var(--r);padding:10px 12px}
.facts b{display:block;font-size:16px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--mute)}
.note{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r);padding:10px 12px;font-size:13px}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--s3);color:var(--text);border:1px solid var(--line-2);border-radius:var(--r);padding:11px 14px;max-width:380px;display:flex;gap:10px;align-items:center;font-weight:500;animation:dlg-in .25s var(--ease)}
.toast::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-ink);flex:none}
.toast.ok::before{background:var(--good)}.toast.bad::before{background:var(--bad)}
.fbitem{padding:16px 18px}
.fbtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.fbtop b{color:#fff;font-weight:500}
.fbmsg{white-space:pre-wrap;color:var(--text-2);line-height:1.6;margin:0 0 12px}
.fbctx{font-size:12px;color:var(--mute);background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin:0 0 12px;overflow-wrap:anywhere}


/* the sidebar: a faint glow of the accent from the top, a fine grain over all of it, and a little larger type */
.side{position:relative;isolation:isolate;padding:16px 12px 12px;
  background:var(--page-grain) 0 0/200px 200px,
    radial-gradient(120% 260px at 0% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 72%),
    radial-gradient(100% 220px at 100% 100%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 75%),var(--s0)}
.side-head{padding:4px 8px 20px}
.side-head .logo{height:28px}
.nav h4{font-size:12px;letter-spacing:.01em;padding:10px 12px 8px}
.nav-item{height:40px;padding:0 12px;font-size:15px;gap:12px}
.nav-item svg{width:18px;height:18px}
.count{height:21px;font-size:11.5px}
/* the account: one card at the foot, its two actions inside it */
.side-foot{padding-top:12px;border-top:0}
.acct{display:grid;gap:10px;padding:12px;border:1px solid var(--line-2);border-radius:var(--r-card);
  background:var(--grain) 0 0/140px 140px,linear-gradient(180deg,color-mix(in srgb,var(--s2) 92%,#fff),var(--s2));background-blend-mode:soft-light,normal}
.acct .who{padding:0;gap:11px}
.acct .who i{width:34px;height:34px;font-size:14px;color:#fff;border:1px solid rgba(255,255,255,.14);
  background:var(--grain) 0 0/140px 140px,var(--fill);background-blend-mode:soft-light,normal}
.acct .who>span:not(.pill){flex:1}
.acct .who b{font-size:14px}
.acct .who .pill{height:20px;font-size:10.5px;padding:0 7px;flex:none}
.acct-acts{display:flex;gap:6px}
.acct-acts .btn.outline{flex:1;justify-content:center;background:var(--s1)}
.acct-acts .btn.outline:hover{background:var(--s3)}
.acct-acts .btn.icon{width:32px;padding:0;flex:none}
.acct-acts .btn.icon:hover{background:var(--bad-soft);color:var(--bad)}
@media (max-width:900px){.acct .who{display:none}.acct{padding:0;border:0;background:none}}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:900px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .side{height:auto;padding:10px 12px}
  .side-head{padding:2px 2px 10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  .nav h4,.who{display:none}
  .nav-item{width:auto;flex:none}
  .side-foot{flex-direction:row;border:0;padding-top:6px}
  main{margin:0 8px 8px;height:auto;overflow:visible}
  .topbar{padding:16px 16px 4px}
  .content{padding:14px 16px 48px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile b{font-size:24px}
}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Sidebar">
    <div class="side-head"><img class="logo" src="/brand/logo-light.svg?v=6" alt="SocialShot"><span class="pill brand">Admin</span></div>
    <nav class="nav" id="nav" aria-label="Admin"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main id="main" class="surface">
    <header class="topbar"><div class="titles"><h1 id="title">Admin</h1><p id="subtitle"></p></div><div class="row" id="actions"></div></header>
    <div class="content" id="view"><div class="empty"><b>Loading…</b></div></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
/* Everything shown here comes from the server and is written into the page through esc(): names and emails are
   typed by the public, so nothing from the data is ever treated as HTML. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I = {
 "chat": "<path d=\"M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1\"/>",
 "check": "<path d=\"M5 12l5 5l10 -10\"/>",
 "home": "<path d=\"M5 12l-2 0l9 -9l9 9l-2 0\"/> <path d=\"M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7\"/> <path d=\"M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6\"/>",
 "users": "<path d=\"M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0\"/> <path d=\"M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2\"/> <path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/> <path d=\"M21 21v-2a4 4 0 0 0 -3 -3.85\"/>",
 "clock": "<path d=\"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\"/> <path d=\"M12 7v5l3 3\"/>",
 "chart": "<path d=\"M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z\"/> <path d=\"M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z\"/> <path d=\"M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z\"/> <path d=\"M4 20h14\"/>",
 "signout": "<path d=\"M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2\"/> <path d=\"M9 12h12l-3 -3\"/> <path d=\"M18 15l3 -3\"/>",
 "arrowr": "<path d=\"M5 12l14 0\"/> <path d=\"M13 18l6 -6\"/> <path d=\"M13 6l6 6\"/>",
 "bolt": "<path d=\"M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11\"/>",
 "video": "<path d=\"M15 10l4.553 -2.276a1 1 0 0 1 1.447 .894v6.764a1 1 0 0 1 -1.447 .894l-4.553 -2.276v-4z\"/> <path d=\"M3 6m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z\"/>",
 "plus": "<path d=\"M12 5l0 14\"/> <path d=\"M5 12l14 0\"/>"
};
const ic = n => `<svg class="ti" viewBox="0 0 24 24" aria-hidden="true">${I[n] || ""}</svg>`;
const num = v => (Number(v) || 0).toLocaleString();
const kfmt = v => v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "k" : String(v);
const when = t => t ? new Date(t * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "Never";
const day = t => t ? new Date(t * 1000).toLocaleDateString([], {day:"numeric", month:"short", year:"numeric"}) : "Never";
const ago = t => { if (!t) return "Never"; const s = Date.now() / 1000 - t; return s < 300 ? "Now" : s < 3600 ? Math.floor(s / 60) + " min ago" : s < 86400 ? Math.floor(s / 3600) + " h ago" : s < 30 * 86400 ? Math.floor(s / 86400) + " d ago" : day(t); };
const ACTION = {disable:"Disabled an account", enable:"Enabled an account", delete:"Deleted an account", "role:admin":"Made an admin", "role:user":"Removed admin"};

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (r.status === 404 || r.status === 401) { location.replace("/app"); throw new Error("Not available"); }   // no longer an admin, or signed out
  if (!r.ok) { let d = r.statusText; try { d = (await r.json()).detail || d; } catch {} throw new Error(typeof d === "string" ? d : "Something went wrong"); }
  return r.json();
}
const send = (path, body) => api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body ?? {})});
function toast(msg, kind = "") {
  const t = document.createElement("div"); t.className = "toast " + kind; t.textContent = msg;
  $("#toasts").append(t); setTimeout(() => t.remove(), kind === "bad" ? 7000 : 3200);
}

const S = {tab:"overview", data:null, me:null, q:"", filter:"all", sort:"created_at", fb:null, fbStatus:"new"};
const TABS = {overview:["Overview", "home", "Sign-ups, videos and AI use across this SocialShot server."],
              users:["Users", "users", "Every account. Open one to see how much it uses the AI."],
              costs:["Video costs", "bolt", "What it takes in AI to make one video, and one clip."],
              feedback:["Feedback", "chat", "Bug reports, feature ideas and other messages from users."],
              activity:["Activity", "clock", "Everything admins have done, newest first."]};
const pathFor = t => "/admin" + (t === "overview" ? "" : "/" + t);
const fromPath = () => { const k = location.pathname.replace(/\/$/, "").split("/")[2]; return TABS[k] ? k : "overview"; };

/* ---------- charts */
function bars(rows, a, fmt, label) {
  const W = 640, H = 190, pl = 44, pt = 10, pb = 22, cw = W - pl, ch = H - pt - pb;
  const max = Math.max(...rows.map(r => r[a] || 0), 0);
  const top = max || 1, step = cw / rows.length, bw = Math.max(3, step - 4);
  let g = "";
  for (let i = 0; i <= 2; i++) { const y = pt + ch - ch * i / 2;
    g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${esc(fmt(top * i / 2))}</text>`; }
  rows.forEach((r, i) => {
    const x = pl + i * step + (step - bw) / 2, h1 = ch * (r[a] || 0) / top;
    if (h1 > 0) g += `<rect class="b1${i === rows.length - 1 ? " now" : ""}" x="${x}" y="${pt + ch - h1}" width="${bw}" height="${h1}" rx="2"><title>${esc(`${r.day}: ${fmt(r[a] || 0)}`)}</title></rect>`;
    if (i % 5 === 0 || i === rows.length - 1) g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(r.day.slice(8) + "/" + r.day.slice(5, 7))}</text>`;
  });
  const none = max ? "" : `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">Nothing in the last 30 days</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${none}</svg>`;
}
function hbars(rows, fmt) {
  const total = rows.reduce((s, r) => s + r[1], 0) || 1;
  return rows.length ? `<div class="hbar">${rows.map(r => `<div class="hbar-row"><div class="top"><span>${esc(r[0])}</span><span>${esc(fmt(r))}</span></div>
    <div class="track"><i style="width:${Math.max(2, r[1] / total * 100)}%"></i></div></div>`).join("")}</div>` : `<p class="help">Nothing yet.</p>`;
}
const tile = (icon, big, label, small = "") => `<div class="tile"><div class="tile-top"><span>${esc(label)}</span>${ic(icon)}</div><b>${esc(big)}</b>${small ? `<small title="${esc(small)}">${esc(small)}</small>` : ""}</div>`;

/* ---------- pages */
function drawOverview(a) {
  const t = a.totals, sv = a.server, ok = (v, l) => `<span class="pill ${v ? "ok" : "bad"}">${esc(l)}</span>`;
  const ai = sv.ai_key ? `AI: ${[sv.ai_provider, sv.ai_model].filter(Boolean).join(", ") || "ready"}` : "No AI key";
  return `<div class="tiles">
      ${tile("users", num(t.users), "Accounts in total", `${num(t.verified)} confirmed their email, ${num(t.disabled)} disabled`)}
      ${tile("plus", num(t.signups_7d), "Signed up, last 7 days", `${num(t.signups_today)} today, ${num(t.signups_30d)} in 30 days`)}
      ${tile("clock", num(t.active_7d), "Active, last 7 days", `${num(t.admins)} admin${t.admins === 1 ? "" : "s"}`)}
      ${tile("video", num(t.videos), "Videos processed", `${num(t.clips)} clips made`)}
    </div><div class="tiles">
      ${tile("bolt", num(t.ai_calls), "AI calls in total", `${num(t.ai_calls_today)} today`)}
      ${tile("chart", kfmt(t.tokens), "AI tokens used", "Counted on your own AI key")}
      ${tile("video", num(t.recording), "Recording right now", "Live streams being clipped")}
      ${tile("clock", num(t.working), "Videos in progress", `${num(sv.running)} running, ${num(sv.waiting)} waiting`)}
    </div>
    <div class="split">
      <div class="card"><div class="card-head"><div><h2>Sign-ups</h2><p class="sub">New accounts per day, last 30 days</p></div></div>${bars(a.daily, "signups", v => String(Math.round(v)), "New accounts per day")}</div>
      <div class="card"><div class="card-head"><div><h2>AI usage</h2><p class="sub">Tokens used per day, last 30 days</p></div></div>${bars(a.daily, "tokens", v => kfmt(Math.round(v)), "AI tokens used per day")}</div>
    </div>
    <div class="split">
      <div class="card"><div class="card-head"><div><h2>AI calls</h2><p class="sub">Per day, last 30 days</p></div></div>${bars(a.daily, "calls", v => String(Math.round(v)), "AI calls per day")}</div>
      <div class="card"><div class="card-head"><div><h2>What the AI is used for</h2><p class="sub">All users, all time</p></div></div>${hbars(a.by_purpose, r => `${num(r[1])} call${r[1] === 1 ? "" : "s"} · ${kfmt(r[2])} tokens`)}</div>
    </div>
    <div class="card"><div class="card-head"><div><h2>Right now</h2><p class="sub">${num(t.recording)} recording, ${num(t.working)} video${t.working === 1 ? "" : "s"} in progress</p></div>
      <div class="row">${ok(sv.ai_key, ai)}${ok(sv.speech_model, "Transcription")}${ok(sv.google, "Google sign-in")}${ok(sv.mail, "Email")}<span class="pill">${esc(sv.database)}</span><span class="pill">${esc(sv.free_gb)} GB free</span>${sv.load ? `<span class="pill ${sv.load.busy ? "warn" : "ok"}">${sv.load.busy ? "Near full: new videos are queueing" : "Has room"}</span><span class="pill">Processor ${esc(sv.load.cpu)}%</span><span class="pill">${esc(sv.load.ram_free_gb)} GB memory free</span><span class="pill">${esc(sv.running)} running, ${esc(sv.waiting)} waiting</span>` : ""}</div>
      ${sv.ai_key ? "" : `<p class="note" style="margin-top:14px">No AI key is set, so clips are picked by loudness only. Add your own key to the .env file on the server (see .env.example) and restart.</p>`}</div>`;
}

function userRows(a) {
  const q = S.q.trim().toLowerCase();
  let rows = a.users.filter(u => !q || u.email.toLowerCase().includes(q) || (u.name || "").toLowerCase().includes(q));
  if (S.filter === "unconfirmed") rows = rows.filter(u => !u.verified);
  if (S.filter === "disabled") rows = rows.filter(u => u.disabled);
  if (S.filter === "admins") rows = rows.filter(u => u.role === "admin");
  return rows.sort((x, y) => (y[S.sort] || 0) - (x[S.sort] || 0));
}
function drawUsers(a) {
  const seg = (k, l) => `<button class="${S.filter === k ? "on" : ""}" data-act="filter" data-k="${k}">${l}</button>`;
  const th = (k, l) => `<th class="num"><button data-act="sort" data-k="${k}" style="all:unset;cursor:pointer;color:${S.sort === k ? "var(--brand-deep)" : "inherit"}">${l}</button></th>`;
  const rows = userRows(a);
  return `<div class="toolbar"><input type="search" id="q" placeholder="Search by name or email" value="${esc(S.q)}" aria-label="Search accounts">
      <div class="seg">${seg("all", "All")}${seg("unconfirmed", "Email not confirmed")}${seg("disabled", "Disabled")}${seg("admins", "Admins")}</div>
      <span class="sub">${num(rows.length)} of ${num(a.users.length)}</span></div>
    <div class="card"><div class="scroll"><table><tr><th>Account</th><th><button data-act="sort" data-k="created_at" style="all:unset;cursor:pointer;color:${S.sort === "created_at" ? "var(--brand-deep)" : "inherit"}">Joined</button></th>
      <th><button data-act="sort" data-k="last_seen" style="all:unset;cursor:pointer;color:${S.sort === "last_seen" ? "var(--brand-deep)" : "inherit"}">Last active</button></th>
      ${th("ai_calls", "AI calls")}${th("tokens", "AI tokens")}${th("videos", "Videos")}${th("clips", "Clips")}</tr>
      ${rows.map(u => `<tr class="u" data-act="user" data-id="${esc(u.id)}"><td><b>${esc(u.name || u.email.split("@")[0])}</b>
          ${u.role === "admin" ? ` <span class="pill brand">Admin</span>` : ""}${u.disabled ? ` <span class="pill bad">Disabled</span>` : ""}${u.verified ? "" : ` <span class="pill warn">Email not confirmed</span>`}
          <div class="em">${esc(u.email)}</div></td>
        <td class="sub">${esc(day(u.created_at))}</td><td class="sub">${esc(ago(u.last_seen))}</td>
        <td class="num">${num(u.ai_calls)}</td><td class="num">${esc(kfmt(u.tokens || 0))}</td>
        <td class="num">${num(u.videos)}</td><td class="num">${num(u.clips)}</td></tr>`).join("")
        || `<tr><td colspan="7"><div class="empty"><b>No accounts match</b>Try another search or filter.</div></td></tr>`}</table></div></div>`;
}

function drawActivity(a) {
  return `<div class="card"><div class="card-head"><div><h2>Admin activity</h2><p class="sub">A permanent record. Entries cannot be edited or removed from here.</p></div></div>
    ${a.log.length ? `<div class="scroll"><table><tr><th>When</th><th>Admin</th><th>Action</th><th>Account</th><th>Details</th></tr>
      ${a.log.map(l => `<tr><td class="sub">${esc(when(l.t))}</td><td>${esc(l.admin || "Removed admin")}</td><td>${esc(ACTION[l.action] || l.action)}</td>
        <td>${esc(l.target || "")}</td><td class="sub">${esc(l.detail)}</td></tr>`).join("")}</table></div>`
      : `<div class="empty"><b>Nothing yet</b>Account changes made by admins are recorded here.</div>`}</div>`;
}

/* ---------- what each video cost in AI. The price is the admin's own AI price, kept in this browser only. */
let price = 0; try { price = Number(localStorage.getItem("ss_ai_price")) || 0; } catch {}
const fmtLen = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
const money = tok => { if (!price) return ""; const v = tok / 1e6 * price; return "$" + (v && v < 0.01 ? v.toFixed(4) : v.toFixed(2)); };
const PURPOSE = s => String(s || "").replace(/^\w/, c => c.toUpperCase());
function drawCosts() {
  const c = S.costs;
  if (!c) return `<div class="empty"><b>Loading…</b></div>`;
  const t = c.totals, withCost = (tok, l) => tile("bolt", kfmt(tok), l, price ? `About ${money(tok)} each` : "Add your AI price below to see it in dollars");
  return `<div class="tiles">
      ${withCost(t.per_video, "AI tokens for one video")}
      ${withCost(t.per_clip, "AI tokens for one clip")}
      ${tile("clock", kfmt(t.per_minute), "Tokens per minute of video", price ? `About ${money(t.per_minute)} a minute` : "Longer videos need more")}
      ${tile("video", num(t.videos), "Videos counted", `${num(t.calls)} AI calls, ${kfmt(t.tokens)} tokens${price ? ", " + money(t.tokens) : ""}`)}
    </div>
    <div class="card"><div class="card-head"><div><h2>Your AI price</h2><p class="sub">What your AI service charges per 1 million tokens (input and output together, roughly). Saved in this browser only.</p></div>
      <label class="price"><span>$</span><input id="price" type="number" min="0" step="0.01" value="${price || ""}" placeholder="0.00" aria-label="Price per 1 million tokens in dollars"><small>per 1M tokens</small></label></div></div>
    <div class="card"><div class="card-head"><div><h2>Every video</h2><p class="sub">Newest first. Names are shown for your own videos only; for other accounts, just the account and the length.</p></div></div>
      ${c.videos.length ? `<div class="scroll"><table><tr><th>Video</th><th>Account</th><th class="num">Length</th><th class="num">Clips</th><th class="num">AI calls</th><th class="num">Tokens</th><th class="num">Per clip</th>${price ? `<th class="num">Cost</th>` : ""}</tr>
        ${c.videos.map(v => `<tr><td><b>${esc(v.title || (v.live ? "A live recording" : "A video"))}</b>${v.deleted ? ` <span class="pill">Deleted</span>` : ""}
            ${v.by.length ? `<div class="em">${v.by.slice(0, 3).map(b => `${esc(PURPOSE(b[0]))} ${esc(kfmt(b[1]))}`).join(" · ")}</div>` : ""}</td>
          <td class="sub">${esc(v.account || "Removed account")}</td>
          <td class="num">${v.duration ? esc(fmtLen(v.duration)) : "–"}</td><td class="num">${num(v.clips)}</td>
          <td class="num">${num(v.calls)}</td><td class="num">${esc(kfmt(v.tokens))}</td>
          <td class="num">${v.clips && v.tokens ? esc(kfmt(Math.round(v.tokens / v.clips))) : "–"}</td>
          ${price ? `<td class="num"><b>${esc(money(v.tokens))}</b></td>` : ""}</tr>`).join("")}</table></div>`
        : `<div class="empty"><b>No videos yet</b>Once videos are made, what each one took in AI shows here.</div>`}</div>`;
}
async function loadCosts() {
  try { S.costs = await api("/api/admin/videos"); } catch (e) { toast(e.message, "bad"); }
  if (S.tab === "costs") draw();
}
document.addEventListener("input", e => {
  if (e.target.id !== "price") return;
  price = Math.max(0, Number(e.target.value) || 0);
  try { price ? localStorage.setItem("ss_ai_price", String(price)) : localStorage.removeItem("ss_ai_price"); } catch {}
  const at = e.target.selectionStart; draw(); const p = $("#price"); if (p) { p.focus(); try { p.setSelectionRange(at, at); } catch {} }
});

const FBK = {bug: ["Bug", "bad"], idea: ["Idea", "brand"], other: ["Message", ""]};
function drawFeedback() {
  const f = S.fb;
  if (!f) return `<div class="empty"><b>Loading…</b></div>`;
  const seg = (k, l) => `<button class="${S.fbStatus === k ? "on" : ""}" data-act="fbfilter" data-k="${k}">${l}${k && f.counts[k] ? ` · ${num(f.counts[k])}` : ""}</button>`;
  return `<div class="toolbar"><div class="seg">${seg("new", "New")}${seg("seen", "Seen")}${seg("done", "Done")}${seg("", "All")}</div></div>
    ${f.items.length ? f.items.map(x => `<div class="card fbitem"><div class="fbtop"><span class="pill ${FBK[x.kind]?.[1] || ""}">${esc(FBK[x.kind]?.[0] || x.kind)}</span>
        <b>${esc(x.name || x.email || "Deleted account")}</b><span class="sub">${esc(x.email)} · ${esc(when(x.t))}${x.page ? " · " + esc(x.page) : ""}</span>
        <span class="pill ${x.status === "done" ? "ok" : x.status === "new" ? "warn" : ""}" style="margin-left:auto">${esc(x.status === "new" ? "New" : x.status === "seen" ? "Seen" : "Done")}</span></div>
      <p class="fbmsg">${esc(x.message)}</p>${x.context ? `<p class="fbctx">${esc(x.context)}</p>` : ""}
      <div class="row">${x.status !== "seen" ? `<button class="btn sm" data-act="fbset" data-id="${x.id}" data-s="seen">Mark seen</button>` : ""}
        ${x.status !== "done" ? `<button class="btn sm" data-act="fbset" data-id="${x.id}" data-s="done">${ic("check")}Done</button>` : `<button class="btn sm" data-act="fbset" data-id="${x.id}" data-s="new">Reopen</button>`}
        ${x.email ? `<a class="btn sm" href="mailto:${esc(x.email)}?subject=${encodeURIComponent("About your SocialShot feedback")}">Reply by email</a>` : ""}</div></div>`).join("")
      : `<div class="card"><div class="empty"><b>Nothing here</b>${S.fbStatus === "new" ? "No new messages. Everything has been looked at." : "Messages appear here as users send them."}</div></div>`}`;
}
async function loadFeedback() {
  try { S.fb = await api("/api/admin/feedback" + (S.fbStatus ? "?status=" + S.fbStatus : "")); } catch (e) { toast(e.message, "bad"); }
  if (S.tab === "feedback") draw();
}
function draw() {
  const a = S.data, [title, , sub] = TABS[S.tab];
  $("#nav").innerHTML = `<h4>Dashboard</h4>` + Object.entries(TABS).map(([k, [l, i]]) =>
    `<a class="nav-item ${S.tab === k ? "on" : ""}" href="${pathFor(k)}" data-act="tab" data-k="${k}">${ic(i)}<span class="label">${l}</span>${k === "users" && a ? `<span class="count">${num(a.totals.users)}</span>` : ""}${k === "feedback" && S.fb?.counts.new ? `<span class="count">${num(S.fb.counts.new)}</span>` : ""}</a>`).join("");
  const me = S.me, initial = me ? ((me.name || me.email || "?").trim()[0] || "?").toUpperCase() : "";
  $("#foot").innerHTML = `<div class="acct">${me ? `<div class="who"><i>${esc(initial)}</i><span><b>${esc(me.name || me.email.split("@")[0])}</b><span>${esc(me.email)}</span></span></div>` : ""}
    <div class="acct-acts"><a class="btn sm outline" href="/app">${ic("arrowr")}Back to the app</a>
      <button class="btn sm ghost icon" data-act="logout" title="Sign out" aria-label="Sign out">${ic("signout")}</button></div></div>`;
  $("#title").textContent = title; $("#subtitle").textContent = sub;
  $("#actions").innerHTML = `<button class="btn sm outline" data-act="refresh">Refresh</button>`;
  if (S.tab === "feedback") { if (!S.fb && !S.fbLoading) { S.fbLoading = true; loadFeedback().finally(() => S.fbLoading = false); } $("#view").innerHTML = drawFeedback(); return; }
  if (S.tab === "costs") { if (!S.costs && !S.costsLoading) { S.costsLoading = true; loadCosts().finally(() => S.costsLoading = false); } $("#view").innerHTML = drawCosts(); return; }
  if (!a) return;
  const keep = document.activeElement?.id === "q" ? $("#q").selectionStart : null;
  $("#view").innerHTML = {overview: drawOverview, users: drawUsers, activity: drawActivity}[S.tab](a);
  if (keep !== null) { $("#q").focus(); $("#q").setSelectionRange(keep, keep); }
}
async function load() {
  try { S.data = await api("/api/admin/overview"); draw(); }
  catch (e) { if (e.message !== "Not available") $("#view").innerHTML = `<div class="empty"><b>Couldn't load</b>${esc(e.message)}</div>`; }
}
function go(tab, push = true) {
  S.tab = tab; if (push && location.pathname !== pathFor(tab)) history.pushState(null, "", pathFor(tab));
  if (tab === "feedback") loadFeedback();
  draw(); $("#main").scrollTo(0, 0);
}
addEventListener("popstate", () => go(fromPath(), false));

/* ---------- account dialogs */
async function userDialog(id) {
  const d = $("#dlg");
  d.innerHTML = `<div class="dlg wide"><p class="help">Loading…</p></div>`; d.showModal();
  let u; try { u = await api(`/api/admin/users/${encodeURIComponent(id)}`); } catch (e) { d.close(); return toast(e.message, "bad"); }
  const row = S.data.users.find(x => x.id === id) || {};
  d.innerHTML = `<div class="dlg wide"><div class="card-head" style="margin:0"><div><h2>${esc(u.name || u.email.split("@")[0])}
      ${u.role === "admin" ? ` <span class="pill brand">Admin</span>` : ""}${u.disabled ? ` <span class="pill bad">Disabled</span>` : ""}</h2><p class="sub">${esc(u.email)}</p></div>
      <div class="row">
        ${u.role === "admin" ? "" : `<button class="btn sm ${u.disabled ? "" : "danger"}" data-act="disable" data-id="${esc(u.id)}" data-off="${u.disabled ? "0" : "1"}">${u.disabled ? "Enable account" : "Disable account"}</button>`}
        ${u.role === "admin" ? "" : `<button class="btn sm danger" data-act="deluser" data-id="${esc(u.id)}">Delete account</button>`}
        <button class="btn sm" data-act="closedlg">Close</button></div></div>
    <div class="facts"><div><b>${num(row.ai_calls)}</b><span>AI calls</span></div><div><b>${esc(kfmt(row.tokens || 0))}</b><span>AI tokens</span></div>
      <div><b>${num(row.videos)}</b><span>Videos</span></div><div><b>${num(row.clips)}</b><span>Clips</span></div>
      <div><b>${esc(day(u.created_at))}</b><span>Joined</span></div><div><b>${esc(ago(u.last_seen))}</b><span>Last active</span></div>
      <div><b>${num(u.signed_in_devices)}</b><span>Signed-in devices</span></div><div><b>${row.verified === false ? "No" : "Yes"}</b><span>Email confirmed</span></div></div>
    <p class="note">You can see how much this account uses the AI. Their videos, clips and connected accounts stay private to them.</p>
    <h3>What they use the AI for</h3>${hbars(u.by_purpose, r => `${kfmt(r[1])} tokens · ${num(r[2])} call${r[2] === 1 ? "" : "s"}`)}
    <h3>Latest AI calls</h3>
    ${u.recent.length ? `<div class="scroll"><table><tr><th>When</th><th>What</th><th class="num">Tokens</th></tr>
      ${u.recent.map(r => `<tr><td class="sub">${esc(when(r.t))}</td><td>${esc(r.purpose)}</td><td class="num">${num(r.tokens)}</td></tr>`).join("")}</table></div>` : `<p class="help">No AI calls yet.</p>`}</div>`;
}
function confirmDialog(title, text, okLabel, danger) {
  return new Promise(res => {
    const d = $("#dlg");
    d.innerHTML = `<form method="dialog" class="dlg"><h2>${esc(title)}</h2><p class="help">${esc(text)}</p>
      <div class="dlg-foot"><button class="btn" value="no">Cancel</button><button class="btn ${danger ? "danger" : "primary"}" value="yes" autofocus>${esc(okLabel)}</button></div></form>`;
    d.onclose = () => { d.onclose = null; res(d.returnValue === "yes"); }; d.returnValue = "no"; if (!d.open) d.showModal();
  });
}

document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; draw(); } });
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  try {
    if (a === "tab") { e.preventDefault(); return go(d.k); }
    if (a === "refresh") { await load(); await loadFeedback(); if (S.tab === "costs") await loadCosts(); return toast("Up to date", "ok"); }
    if (a === "fbfilter") { S.fbStatus = d.k; return loadFeedback(); }
    if (a === "fbset") { await send(`/api/admin/feedback/${d.id}`, {status: d.s}); toast(d.s === "done" ? "Marked done" : d.s === "seen" ? "Marked seen" : "Reopened", "ok"); return loadFeedback(); }
    if (a === "filter") { S.filter = d.k; return draw(); }
    if (a === "sort") { e.stopPropagation(); S.sort = d.k; return draw(); }
    if (a === "closedlg") return $("#dlg").close();
    if (a === "user") return userDialog(d.id);
    if (a === "disable") {
      const off = d.off === "1", u = S.data.users.find(x => x.id === d.id); if (!u) return;
      $("#dlg").close();
      if (!await confirmDialog(off ? "Disable this account?" : "Enable this account?",
        off ? `${u.email} is signed out everywhere and cannot sign in until you enable the account again. Their data is kept.` : `${u.email} will be able to sign in again.`,
        off ? "Disable account" : "Enable account", off)) return;
      await send(`/api/admin/users/${encodeURIComponent(d.id)}/disabled`, {disabled:off});
      toast(off ? "Account disabled" : "Account enabled", "ok"); return load();
    }
    if (a === "deluser") {
      const u = S.data.users.find(x => x.id === d.id); if (!u) return;
      $("#dlg").close();
      const typed = prompt(`Delete ${u.email} and everything in the account for good?\n\nCreators, recordings, videos and clips are all removed. This cannot be undone.\n\nType the email address to confirm:`);
      if (!typed) return;
      await send(`/api/admin/users/${encodeURIComponent(d.id)}/delete`, {confirm: typed});
      toast("Account deleted", "ok"); return load();
    }
    if (a === "logout") { await fetch("/api/auth/logout", {method:"POST"}); location.href = "/"; return; }
  } catch (err) { toast(err.message, "bad"); }
});

(async () => {
  S.tab = fromPath(); draw();
  try { S.me = (await api("/api/auth/me")).user; } catch {}
  await load();
  setInterval(() => { if (!$("#dlg").open && document.visibilityState === "visible") load(); }, 30000);
})();
</script>
</body>
</html>
